<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage — ClibboTech</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #121212; color: #eee; line-height: 1.6; padding: 2rem; }
        .container { max-width: 600px; margin: 0 auto; }
        h1, h2 { text-align: center; margin-bottom: 2rem; color: #fff; }
        h2 { font-size: 1.3rem; margin-top: 2.5rem; }

        /* Login Screen */
        #password-lock {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #1f1f1f;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 100;
        }
        #password-lock input {
            padding: 0.8rem; font-size: 1rem; width: 280px;
            margin: 1rem; border-radius: 4px; border: none;
        }
        #password-lock button {
            padding: 0.8rem 2rem; background: #0070f3; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-size: 1rem;
        }
        .error { color: #ff6b6b; margin-top: 1rem; }

        /* Main Admin Content */
        #admin-content { display: none; }
        form { background: #1f1f1f; padding: 2rem; border-radius: 8px; margin-top: 1rem; }
        label { display: block; margin: 1rem 0 0.3rem; font-weight: 500; }
        input, textarea {
            width: 100%; padding: 0.6rem; border: none; border-radius: 4px;
            background: #333; color: #fff; font-size: 1rem;
        }
        button[type="submit"] {
            margin-top: 1.5rem; padding: 0.8rem 1.5rem;
            background: #0070f3; color: white; border: none;
            border-radius: 4px; cursor: pointer; font-size: 1rem; width: 100%;
        }
        button[type="submit"]:hover { background: #0057b8; }
        #result { margin-top: 1.5rem; padding: 1rem; border-radius: 4px; }
        .success { background: #0f3d1f; color: #98fb98; }
        .error-msg { background: #3d0f0f; color: #ffb3b3; }
        .link-box { margin-top: 0.8rem; display: flex; gap: 0.5rem; }
        .link-box input { flex: 1; background: #2a2a2a; }
        .link-box button { padding: 0.5rem 1rem; background: #444; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .logout-btn {
            position: absolute; top: 1rem; right: 1rem;
            padding: 0.5rem 1rem; background: #444; color: #fff;
            border: none; border-radius: 4px; cursor: pointer;
        }
    </style>
</head>
<body>

<!-- Login Screen -->
<div id="password-lock">
    <h1>ClibboTech Admin</h1>
    <input type="password" id="admin-password" placeholder="Enter admin password">
    <button onclick="checkPassword()">Login</button>
    <div id="login-error" class="error"></div>
</div>

<!-- Admin Content (Hidden Until Login) -->
<div id="admin-content" class="container">
    <button class="logout-btn" onclick="logout()">Logout</button>
    <h1>Admin Dashboard</h1>

    <h2>Add New Product</h2>
    <form id="productForm">
        <label>Product Name:</label>
        <input type="text" id="productName" required placeholder="e.g. iPad 9th Gen — 64GB — Refurbished">

        <label>Description:</label>
        <textarea id="productDesc" rows="4" required placeholder="Full product details..."></textarea>

        <label>Price (£):</label>
        <input type="number" step="0.01" id="productPrice" required placeholder="e.g. 125.00">

        <label>Category:</label>
        <input type="text" id="productCategory" placeholder="e.g. iPads, iPhones, Samsung, Repairs">

        <label>Image URL (optional):</label>
        <input type="url" id="productImage" placeholder="https://your-site.com/image.jpg">

        <button type="submit">Create Product & Stripe Payment Link</button>
    </form>

    <div id="result"></div>
</div>

<script>
// 🔐 ADMIN PASSWORD
const ADMIN_PASSWORD = 'Jaxson2024@';

// Login Check
function checkPassword() {
    const input = document.getElementById('admin-password').value;
    if (input === ADMIN_PASSWORD) {
        document.getElementById('password-lock').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
        localStorage.setItem('clibbotech_admin', 'logged_in');
    } else {
        document.getElementById('login-error').textContent = 'Incorrect password — try again';
    }
}

// Auto-login check if already authenticated
window.onload = function() {
    if (localStorage.getItem('clibbotech_admin') === 'logged_in') {
        document.getElementById('password-lock').style.display = 'none';
        document.getElementById('admin-content').style.display = 'block';
    }
    // Enter key submits password
    document.getElementById('admin-password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkPassword();
    });
};

// Logout
function logout() {
    localStorage.removeItem('clibbotech_admin');
    document.getElementById('admin-password').value = '';
    document.getElementById('password-lock').style.display = 'flex';
    document.getElementById('admin-content').style.display = 'none';
}

// 🛒 Create Product & Stripe Link
document.getElementById('productForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const resultDiv = document.getElementById('result');
    resultDiv.innerHTML = '<p>Creating product in Stripe...</p>';
    resultDiv.className = '';

    const formData = {
        name: document.getElementById('productName').value,
        description: document.getElementById('productDesc').value,
        price: parseFloat(document.getElementById('productPrice').value),
        category: document.getElementById('productCategory').value,
        imageUrl: document.getElementById('productImage').value
    };

    try {
        const response = await fetch('/.netlify/functions/create-product', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (data.success) {
            resultDiv.className = 'success';
            resultDiv.innerHTML = `
                <p><strong>✅ Product created successfully!</strong></p>
                <p>Payment link generated — copy this to your shop page button:</p>
                <div class="link-box">
                    <input type="text" value="${data.paymentLink}" readonly id="payment-link">
                    <button onclick="document.getElementById('payment-link').select(); document.execCommand('copy')">Copy</button>
                </div>
            `;
            document.getElementById('productForm').reset();
        } else {
            resultDiv.className = 'error-msg';
            resultDiv.innerHTML = `<p><strong>❌ Error:</strong> ${data.error}</p>`;
        }
    } catch (error) {
        resultDiv.className = 'error-msg';
        resultDiv.innerHTML = `<p><strong>❌ Connection Error:</strong> ${error.message}<br>Check that the Netlify function is deployed and the folder structure is correct.</p>`;
    }
});
</script>

</body>
</html>
